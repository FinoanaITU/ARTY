[pytest]

testpaths = tests

python_files = test_*.py

python_classes = Test*

python_functions = test_*

addopts = 
    -v
    --strict-markers
    --disable-warnings
    --tb=short
    --color=yes
    --cov=Back/app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=70

markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    auth: Tests d'authentification
    slow: Tests lents
    api: Tests d'API

# Configuration asyncio
asyncio_mode = auto

# Configuration de la couverture
[coverage:run]
source = Back/app
omit = 
    */tests/*
    */__pycache__/*
    */migrations/*
    */alembic/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
