[pytest]
# Configuration pytest pour les tests

# Répertoires de recherche des tests
testpaths = tests

# Fichiers de test à rechercher
python_files = test_*.py

# Classes de test à rechercher
python_classes = Test*

# Fonctions de test à rechercher
python_functions = test_*

# Options par défaut
addopts = 
    -v
    --strict-markers
    --disable-warnings
    --tb=short
    --color=yes
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=70

# Marqueurs personnalisés
markers =
    unit: Tests unitaires
    integration: Tests d'intégration
    auth: Tests d'authentification
    slow: Tests lents
    api: Tests d'API

# Configuration asyncio
asyncio_mode = auto

# Configuration de la couverture
[coverage:run]
source = app
omit = 
    */tests/*
    */__pycache__/*
    */migrations/*
    */alembic/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
