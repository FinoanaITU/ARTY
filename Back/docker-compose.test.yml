version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: artizaho-postgres-test
    environment:
      POSTGRES_DB: artizaho_test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"  # Port différent pour éviter les conflits avec PostgreSQL de dev
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d artizaho_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - test-network

volumes:
  postgres_test_data:

networks:
  test-network:
    driver: bridge

